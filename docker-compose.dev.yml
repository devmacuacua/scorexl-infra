# Auto-generated build-context overlay for local development.
#
# Only used via scripts/dev.sh — never referenced by scripts/deploy.sh, so
# production always pulls prebuilt images from GHCR and is unaffected by
# this file (production has no sibling source checkouts to build from).
#
# Regenerate if new services are added to docker-compose.yml:
#   ./scripts/dev.sh regen
services:
  scorexl-football-api:
    build:
      context: ../scorexl-football-api
    image: !reset null
  scorexl-basketball-api:
    build:
      context: ../scorexl-basketball-api
    image: !reset null
  scorexl-nba-api:
    build:
      context: ../scorexl-nba-api
    image: !reset null
  scorexl-volleyball-api:
    build:
      context: ../scorexl-volleyball-api
    image: !reset null
  scorexl-mlb-api:
    build:
      context: ../scorexl-mlb-api
    image: !reset null
  scorexl-user-api:
    build:
      context: ../scorexl-user-api
    image: !reset null
volumes:
  scorexl_football_postgres_data:
    external: false
  scorexl_basketball_postgres_data:
    external: false
  scorexl_nba_postgres_data:
    external: false
  scorexl_mlb_postgres_data:
    external: false
  scorexl_afl_postgres_data:
    external: false
  scorexl_user_postgres_data:
    external: false
