server {
    listen 80;
    server_name api.scorexl.com;

    # API pública do scorexl-backend (app mobile e quem mais a quiser):
    #   /picks/api/v1/...  palpites, resultados, ROI (só leitura)
    #   /user/api/v1/...   conta, push; o backend exige token (chave interna ou ID token Google)
    location /picks/ {
        limit_except GET HEAD OPTIONS { deny all; }
        proxy_pass http://127.0.0.1:8080/picks/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /user/ {
        client_max_body_size 64k;
        proxy_pass http://127.0.0.1:8080/user/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        return 404;
    }
}
