services:
  # ════════════════════════════════════════════════════════════════════════
  # BACKEND — scorexl-backend: picks (imported from the scorexl-picks feed),
  # users, push and the basketball history, one Postgres with one schema per
  # module. No pick engines or API-Sports syncs anymore (2026-11-04).
  #
  # Public: api.scorexl.com/picks/... and /user/..., basketball-api.scorexl.com
  # -> /basketball. See nginx/*.conf.
  # ════════════════════════════════════════════════════════════════════════

  scorexl-backend:
    container_name: scorexl-backend
    image: ghcr.io/devmacuacua/scorexl-backend:latest
    restart: always
    ports:
      # loopback only: Docker-published ports bypass ufw; nginx proxies locally
      - "127.0.0.1:8080:8080"
    dns:
      - 8.8.8.8
      - 8.8.4.4
    env_file:
      - .env
    environment:
      SERVER_PORT: 8080
      # football had 512m, every other API 256m (3.5g total across 13 JVMs)
      JAVA_TOOL_OPTIONS: ${BACKEND_JAVA_TOOL_OPTIONS:--Xmx1g -XX:MaxMetaspaceSize=384m -Xss512k}
      SPRING_DATASOURCE_URL: jdbc:postgresql://scorexl-postgres:5432/scorexl
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${BACKEND_POSTGRES_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "false"
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
    depends_on:
      - scorexl-postgres
    networks:
      - scorexl-network

  scorexl-postgres:
    image: postgres:16
    container_name: scorexl-postgres
    restart: always
    environment:
      POSTGRES_DB: scorexl
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${BACKEND_POSTGRES_PASSWORD}
    volumes:
      - scorexl_postgres_data:/var/lib/postgresql/data
    ports:
      # loopback only (Docker-published ports bypass ufw). For analysis, tunnel:
      #   ssh -L 5440:127.0.0.1:5440 root@<droplet>  ->  localhost:5440
      - "127.0.0.1:5440:5432"
    networks:
      - scorexl-network

  # ════════════════════════════════════════════════════════════════════════
  # WEB
  # ════════════════════════════════════════════════════════════════════════

  scorexl-web:
    container_name: scorexl-web
    image: ghcr.io/devmacuacua/scorexl-web:latest
    restart: always
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env
    environment:
      # server-side calls go straight to the backend over the docker network
      # (not through the public subdomains: works before DNS points here, and
      # skips Cloudflare + nginx). NEXT_PUBLIC_* stay public — they're baked
      # into the browser bundle at build time.
      SCOREXL_PICKS_API_URL: http://scorexl-backend:8080/picks
      SCOREXL_USER_API_URL: http://scorexl-backend:8080/user
    depends_on:
      - scorexl-backend
    networks:
      - scorexl-network

  # ════════════════════════════════════════════════════════════════════════
  # ANALYTICS (Umami — self-hosted, 2026-07-27)
  # ════════════════════════════════════════════════════════════════════════

  # No profile, like web/user-api above: analytics isn't per-sport, so it
  # should always be up regardless of which --profile flags a deploy uses.
  scorexl-umami:
    container_name: scorexl-umami
    image: ghcr.io/umami-software/umami:postgresql-latest
    restart: always
    ports:
      - "127.0.0.1:18000:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${UMAMI_POSTGRES_PASSWORD}@scorexl-umami-postgres:5432/${UMAMI_POSTGRES_DB}
      APP_SECRET: ${UMAMI_APP_SECRET}
    depends_on:
      - scorexl-umami-postgres
    networks:
      - scorexl-network

  scorexl-umami-postgres:
    image: postgres:16
    container_name: scorexl-umami-postgres
    restart: always
    environment:
      POSTGRES_DB: ${UMAMI_POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${UMAMI_POSTGRES_PASSWORD}
    volumes:
      - scorexl_umami_postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5445:5432"
    networks:
      - scorexl-network

volumes:
  scorexl_postgres_data:
    # fixed name, independent of the checkout folder — production data lives here, never rename
    name: scorexl_backend_postgres_data
  scorexl_umami_postgres_data:

networks:
  scorexl-network:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "true"
    ipam:
      config:
        # Distinct from the 4 legacy repos' subnets (basketball 172.28.0.0/16,
        # nba 172.31.0.0/16, football/web unpinned/default-assigned) — chosen
        # outside Docker's typical auto-assigned 172.17-172.31 range so it
        # can't collide with those or any other bridge network already on
        # the host.
        - subnet: 10.89.0.0/24
