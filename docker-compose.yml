      - ./docker/postgres/nba-init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5435:5432"
    networks:
      - scorexl-network

  # ════════════════════════════════════════════════════════════════════════
  # VOLLEYBALL (new)
  # ════════════════════════════════════════════════════════════════════════

  scorexl-volleyball-api:
    container_name: scorexl-volleyball-api
    profiles: ["volleyball"]
    # Image does not exist yet — scorexl-volleyball-api is being built by a
    # parallel workstream. Referenced here so this compose file is ready the
    # moment it's pushed to ghcr.io.
    image: ghcr.io/devmacuacua/scorexl-volleyball-api:latest
    restart: always
    ports:
      - "8000:8000"
    dns:
      - 8.8.8.8
      - 8.8.4.4
    env_file:
      - .env
    environment:
      SERVER_PORT: 8000
      JAVA_TOOL_OPTIONS: "-Xmx256m -XX:MaxMetaspaceSize=128m -Xss512k"
      SPRING_DATASOURCE_URL: jdbc:postgresql://scorexl-volleyball-postgres:5432/${VOLLEYBALL_POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${VOLLEYBALL_POSTGRES_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "false"
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      API_VOLLEYBALL_API_KEY: ${API_VOLLEYBALL_API_KEY}
      USER_API_URL: http://scorexl-user-api:9000
      # Engine URL comes purely from .env (env_file above) — see
      # VOLLEYBALL_WINNER_ENGINE_URL in .env.example.
    depends_on:
      - scorexl-volleyball-postgres
      - scorexl-user-api
    networks:
      - scorexl-network

  scorexl-volleyball-winner-engine:
    container_name: scorexl-volleyball-winner-engine
    profiles: ["volleyball"]
    # Image does not exist yet — scorexl-volleyball-winner-engine is being
    # built by a parallel workstream. Referenced here so this compose file
    # is ready the moment it's pushed to ghcr.io.
    image: ghcr.io/devmacuacua/scorexl-volleyball-winner-engine:latest
    restart: always
    env_file:
      - .env
    environment:
      SERVER_PORT: 8001
      # -Xmx128m matching every other stateless engine's low heap cap.
      JAVA_TOOL_OPTIONS: "-Xmx128m -XX:MaxMetaspaceSize=64m -Xss256k"
    ports:
      - "8001:8001"
    networks:
      - scorexl-network

  scorexl-volleyball-postgres:
    image: postgres:16
    container_name: scorexl-volleyball-postgres
    profiles: ["volleyball"]
    restart: always
    environment:
      POSTGRES_DB: ${VOLLEYBALL_POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${VOLLEYBALL_POSTGRES_PASSWORD}
    volumes:
      - scorexl_volleyball_postgres_data:/var/lib/postgresql/data
    # 5434 was oddly skipped by the original 4 repos (5432/5433/5435/5436
    # used) — reused here for the new sport instead of leaving it dead.
    ports:
      - "5434:5432"
    networks:
      - scorexl-network

  # ════════════════════════════════════════════════════════════════════════
  # WEB + USER API
  # ════════════════════════════════════════════════════════════════════════

  scorexl-web:
    container_name: scorexl-web
    image: ghcr.io/devmacuacua/scorexl-web:latest
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - scorexl-user-api
    networks:
      - scorexl-network

  scorexl-user-api:
    container_name: scorexl-user-api
    image: ghcr.io/devmacuacua/scorexl-user-api:latest
    restart: always
    ports:
      - "9000:9000"
    env_file:
      - .env
    environment:
      SERVER_PORT: 9000
      JAVA_TOOL_OPTIONS: "-Xmx256m -XX:MaxMetaspaceSize=128m -Xss512k"
      SPRING_DATASOURCE_URL: jdbc:postgresql://scorexl-user-postgres:5432/scorexl_user
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${USER_POSTGRES_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      - scorexl-user-postgres
    networks:
      - scorexl-network

  scorexl-user-postgres:
    image: postgres:16
    container_name: scorexl-user-postgres
    restart: always
    environment:
      POSTGRES_DB: scorexl_user
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${USER_POSTGRES_PASSWORD}
    ports:
      - "5436:5432"
    volumes:
      - scorexl_user_postgres_data:/var/lib/postgresql/data
    networks:
      - scorexl-network

volumes:
  scorexl_football_postgres_data:
  scorexl_basketball_postgres_data:
  scorexl_nba_postgres_data:
  scorexl_volleyball_postgres_data:
  scorexl_user_postgres_data:

networks:
  scorexl-network:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "true"
    ipam:
      config:
        # Distinct from the 4 legacy repos' subnets (basketball 172.28.0.0/16,
        # nba 172.31.0.0/16, football/web unpinned/default-assigned) — chosen
        # outside Docker's typical auto-assigned 172.17-172.31 range so it
        # can't collide with those or any other bridge network already on
        # the host.
        - subnet: 10.89.0.0/24
