    image: ghcr.io/devmacuacua/scorexl-f1-api:latest
    restart: always
    ports:
      - "16000:16000"
    dns:
      - 8.8.8.8
      - 8.8.4.4
    env_file:
      - .env
    environment:
      SERVER_PORT: 16000
      JAVA_TOOL_OPTIONS: "-Xmx256m -XX:MaxMetaspaceSize=128m -Xss512k"
      SPRING_DATASOURCE_URL: jdbc:postgresql://scorexl-f1-postgres:5432/${F1_POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${F1_POSTGRES_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "false"
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      API_F1_API_KEY: ${API_F1_API_KEY}
      USER_API_URL: http://scorexl-user-api:9000
    depends_on:
      - scorexl-f1-postgres
      - scorexl-user-api
    networks:
      - scorexl-network

  scorexl-f1-postgres:
    image: postgres:16
    container_name: scorexl-f1-postgres
    profiles: ["f1"]
    restart: always
    environment:
      POSTGRES_DB: ${F1_POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${F1_POSTGRES_PASSWORD}
    volumes:
      - scorexl_f1_postgres_data:/var/lib/postgresql/data
    ports:
      - "5443:5432"
    networks:
      - scorexl-network

