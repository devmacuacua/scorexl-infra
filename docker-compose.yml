services:
  # ════════════════════════════════════════════════════════════════════════
  # FOOTBALL
  # ════════════════════════════════════════════════════════════════════════

  scorexl-football-api:
    container_name: scorexl-football-api
    profiles: ["football"]
    image: ghcr.io/devmacuacua/scorexl-football-api:latest
    restart: always
    ports:
      - "4000:4000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      SERVER_PORT: 4000
      JAVA_TOOL_OPTIONS: "-Xmx512m -XX:MaxMetaspaceSize=192m -Xss512k"
      SPRING_DATASOURCE_URL: jdbc:postgresql://scorexl-football-postgres:5432/${FOOTBALL_POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${FOOTBALL_POSTGRES_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "false"
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      # Now reachable by service name — both containers sit on the same
      # shared network, so the old host.docker.internal hack is no longer
      # needed for this one. Left extra_hosts above in place regardless,
      # in case anything else in the image still relies on it.
      USER_API_URL: http://scorexl-user-api:9000
    depends_on:
      - scorexl-football-postgres
      - scorexl-user-api
    networks:
      - scorexl-network

  scorexl-football-postgres:
    image: postgres:16
    container_name: scorexl-football-postgres
    profiles: ["football"]
    restart: always
    environment:
      POSTGRES_DB: ${FOOTBALL_POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${FOOTBALL_POSTGRES_PASSWORD}
    volumes:
      - scorexl_football_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/football-init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - scorexl-network

  scorexl-football-handicap-engine:
