volumes:
  scorexl_football_postgres_data:
    external: true
    name: scorexl-football-infra_scorexl_football_postgres_data
  scorexl_basketball_postgres_data:
    external: true
    name: scorexl-basketball-infra_scorexl_basketball_postgres_data
  scorexl_nba_postgres_data:
    external: true
    name: scorexl-nba-infra_scorexl_nba_postgres_data
  scorexl_volleyball_postgres_data:
  scorexl_mlb_postgres_data:
    external: true
    name: scorexl-mlb-infra_scorexl_mlb_postgres_data
  scorexl_afl_postgres_data:
    external: true
    name: scorexl-afl-infra_scorexl_afl_postgres_data
  scorexl_nfl_postgres_data:
  scorexl_nhl_postgres_data:
  scorexl_rugby_postgres_data:
  scorexl_handball_postgres_data:
  scorexl_f1_postgres_data:
  scorexl_mma_postgres_data:
  scorexl_user_postgres_data:
    external: true
    name: scorexl-web-infra_scorexl_user_postgres_data

networks:
  scorexl-network:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "true"
    ipam:
      config:
        # Distinct from the 4 legacy repos' subnets (basketball 172.28.0.0/16,
        # nba 172.31.0.0/16, football/web unpinned/default-assigned) — chosen
        # outside Docker's typical auto-assigned 172.17-172.31 range so it
        # can't collide with those or any other bridge network already on
        # the host.
        - subnet: 10.89.0.0/24
